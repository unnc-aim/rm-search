# Local development dependencies for running the manual test functions:
# PostgreSQL + Meilisearch + Tika. Start with `docker compose up -d` in
# this directory; the DSNs in svc/context4test.go and database/gen.go
# point at these services. The schema is applied automatically by the
# binary at startup (database/schema).
services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: rm_search
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5432:5432"
    volumes:
      - ./pg/:/var/lib/postgresql/data

  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "123456"
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - ./meili/:/meili_data

  tika:
    container_name: tika
    image: apache/tika:3.1.0.0
    restart: unless-stopped
    ports:
      - "9998:9998"
    environment:
      _JAVA_OPTIONS: -XX:UseSVE=0
