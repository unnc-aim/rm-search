# Expose rm-search behind the same /api/ms prefix the production site
# uses, so clients (e.g. aim-feishu-rm-assistant) work unchanged.
server {
    listen 80;

    location /api/ms/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://rm-search:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://rm-search:8080/healthz;
    }
}
