# Self-hosted rm-search stack: PostgreSQL + Meilisearch + rm-search.
# See deploy/README.md for the bring-up steps.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: rm_search
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      # Schema is applied on first boot only (empty data dir).
      - ../database/rm_search.sql:/docker-entrypoint-initdb.d/rm_search.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rm_search"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
      MEILI_NO_ANALYTICS: "true"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/meili:/meili_data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  rm-search:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY_NAME}:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${LISTEN_PORT:-8081}:8080"
    volumes:
      # The binary reads etc/config.yaml relative to its workdir /root.
      - ./config.yaml:/root/etc/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
